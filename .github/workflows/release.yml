name: Release oxpg (FiveM resource)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example v1.0.0)
        required: true
        default: v1.0.0
        type: string

permissions: {}

concurrency:
  group: oxpg-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish FiveM resource
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          # For manual dispatch, start from the selected branch commit. The
          # requested release tag may not exist yet; action-gh-release creates it.
          # For tag pushes, github.sha is the commit referenced by the pushed tag.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and source commit
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$RELEASE_TAG'. Expected vX.Y.Z."
            exit 1
          fi

          source_commit="$(git rev-parse HEAD)"

          if [[ "$EVENT_NAME" == "push" ]]; then
            tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "$tag_commit" != "$source_commit" ]]; then
              echo "::error::Tag $RELEASE_TAG does not point to the checked-out source commit."
              exit 1
            fi
            source_commit="$tag_commit"
          elif git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            # Re-dispatching an existing version always rebuilds the immutable tag,
            # not whichever commit happens to be at the selected branch today.
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            source_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            git checkout --detach "$source_commit"
          else
            # On manual dispatch, a new version is created by the release action
            # after tests and packaging succeed. It points to this dispatch SHA.
            echo "Tag $RELEASE_TAG does not exist; it will be created from $source_commit."
          fi

          echo "source_sha=$source_commit" >> "$GITHUB_OUTPUT"
          echo "Preparing $RELEASE_TAG from $source_commit"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-

      - name: Install dependencies
        run: bun install --no-save

      - name: Run unit tests
        run: bun run test

      - name: Build resource
        run: bun run build
        env:
          TGT_RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}

      - name: Package FiveM resource
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$RUNNER_TEMP/oxpg-release/oxpg"
          archive="$GITHUB_WORKSPACE/oxpg.zip"

          rm -rf "$RUNNER_TEMP/oxpg-release" "$archive"
          mkdir -p "$package_dir/lib" "$package_dir/web"

          cp LICENSE README.md fxmanifest.lua ui.lua "$package_dir/"
          cp -a dist logger "$package_dir/"
          cp -a lib/MySQL.lua "$package_dir/lib/"
          cp -a web/build "$package_dir/web/"

          command -v zip >/dev/null
          command -v unzip >/dev/null

          # Run zip from inside the resource folder so every entry is rooted at
          # fxmanifest.lua, not inside an extra oxpg/ parent directory.
          (
            cd "$package_dir"
            zip -q -r -X "$archive" \
              fxmanifest.lua LICENSE README.md ui.lua dist lib logger web
          )

          test -s "$archive"
          (cd "$GITHUB_WORKSPACE" && sha256sum oxpg.zip > oxpg.zip.sha256)

      - name: Verify release archive layout
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fxq "name 'oxpg'" fxmanifest.lua; then
            echo "::error::Generated manifest must identify the resource as oxpg."
            exit 1
          fi

          if ! grep -Fxq "provide 'oxmysql'" fxmanifest.lua; then
            echo "::error::Generated manifest must provide the legacy oxmysql resource name."
            exit 1
          fi

          entries="$(unzip -Z1 oxpg.zip)"

          for required in \
            fxmanifest.lua \
            LICENSE \
            README.md \
            ui.lua \
            dist/build.js \
            lib/MySQL.lua \
            logger/fivemanage.js \
            web/build/index.html; do
            if ! grep -Fxq "$required" <<< "$entries"; then
              echo "::error::Release archive is missing root entry: $required"
              exit 1
            fi
          done

          if grep -Eq '^(\./)?oxpg/' <<< "$entries"; then
            echo "::error::Release archive contains an unwanted oxpg/ parent directory."
            exit 1
          fi

          if ! grep -Eq '^web/build/assets/[^/]+$' <<< "$entries"; then
            echo "::error::Release archive is missing built web assets."
            exit 1
          fi

          echo "Verified root-level FiveM resource layout:"
          printf '%s\n' "$entries" | head -40

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ steps.validate.outputs.source_sha }}
          name: oxpg ${{ inputs.release_tag || github.ref_name }}
          files: |
            oxpg.zip
            oxpg.zip.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
