name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run unit tests with coverage
        run: bun run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build resource and TypeScript exports
        run: bun run build
      - name: Verify generated FiveM resource identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq "name 'oxpg'" fxmanifest.lua
          grep -Fxq "provide 'oxmysql'" fxmanifest.lua
          grep -Fxq "provide 'mysql-async'" fxmanifest.lua
          grep -Fxq "provide 'ghmattimysql'" fxmanifest.lua
